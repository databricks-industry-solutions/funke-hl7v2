resources:
  dashboards:
    utilization:
      display_name: Hospital Bed Utilization
      file_path: ./utilization.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # Publish with the deployer's credentials so the embedded dashboard (Dashboard tab in the
      # control-room app) renders for demo viewers without per-user data grants.
      embed_credentials: true
      permissions:
        # The control-room app's service principal needs to see the dashboard so its runtime
        # Lakeview lookup can resolve the embed URL for the Dashboard tab.
        - level: CAN_READ
          service_principal_name: ${resources.apps.adt_control_room.service_principal_client_id}
