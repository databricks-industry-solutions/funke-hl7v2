resources:
  pipelines:
    bed_utilization:
      name: Bed Utilization (Gold)
      # Silver -> gold for the demo. Split out of hl7_ingest so the ingest pipeline stays a
      # pure landing->silver stream and the gold layer (which the metric views depend on) can
      # be bootstrapped on its own schedule.
      libraries:
        - glob:
            include: transformations/**
      serverless: true
      continuous: true
      catalog: ${resources.schemas.primary.catalog_name}
      schema: ${resources.schemas.primary.name}
      root_path: .
      environment:
        dependencies:
          - ../../dist/funke-0.1.*.whl
      configuration:
        catalog: ${var.catalog}
        schema: ${resources.schemas.primary.name}
      permissions:
        # The control-room app's service principal pauses/resumes this pipeline at runtime to
        # idle serverless compute between demo sessions.
        - level: CAN_MANAGE
          service_principal_name: ${resources.apps.adt_control_room.service_principal_client_id}
